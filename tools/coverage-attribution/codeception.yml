# From this directory, run each case separately, for example:
# php -d pcov.enabled=1 -d pcov.directory=. ../../vendor/bin/codecept run Unit --filter testUndeclaredExecution --coverage --coverage-xml
# Inspect /tmp/kilo/runit-attribution-output/coverage.xml after each run.
# This fixture is a diagnostic, not an isolation gate or a production suite.
paths:
    tests: tests
    output: /tmp/kilo/runit-attribution-output
    data: tests
    support: tests
    envs: tests
settings:
    bootstrap: _bootstrap.php
coverage:
    enabled: true
    strict_covers_annotation: true
    show_uncovered: true
    include:
        - production/*
