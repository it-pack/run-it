# Codeception Test Suite Configuration
#
# Suite for port conformance verification.
#
# Runs the framework-agnostic port verifiers (src/Conformance/Verifier) against
# the bundled first-party adapters through RunItPortFixture, satisfying the M13
# acceptance gate item "All first-party adapters pass their own conformance
# suites".

actor: ConformanceTester
modules:
    enabled:
        - Asserts
step_decorators: ~
